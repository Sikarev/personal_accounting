# CI бэкенда: формат, статический анализ, актуальность сгенерированного кода, тесты.
name: api

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pa
          POSTGRES_PASSWORD: pa_dev_password
          POSTGRES_DB: pa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pa -d pa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://pa:pa_dev_password@localhost:5432/pa?sslmode=disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы (запусти gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # CGO_ENABLED=0 — как на Windows без gcc: sqlc берёт парсер Postgres,
      # собранный в WebAssembly, а не C-версию. Результат генерации тот же,
      # а сборка sqlc быстрее.
      - name: сгенерированный код актуален
        env:
          CGO_ENABLED: "0"
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain .)" ]; then
            echo "Сгенерированный код устарел: запусти go generate ./... в api/ и закоммить результат."
            git status --porcelain .
            git diff
            exit 1
          fi

      - name: go test
        run: go test -race ./...
