openapi: 3.0.3
info:
  title: Домашняя бухгалтерия API
  version: 1.0.0
  description: |
    Контракт HTTP API. Соглашения (ошибки, деньги, даты, пагинация) — в docs/api.md.

    Пути ниже указаны относительно `servers[0].url` (`/api/v1`):
    `/currencies` обслуживается по адресу `/api/v1/currencies`.

    Авторизация — cookie сессии `pa_session` (см. `cookieAuth`). По умолчанию
    каждая операция требует входа; публичные помечены `security: []`.
    Без действующей сессии защищённая операция отвечает 401 `unauthorized`.

servers:
  - url: /api/v1

# Глобально все операции требуют сессии. Публичные операции явно
# переопределяют это пустым списком: security: [].
security:
  - cookieAuth: []

tags:
  - name: reference
    description: Справочники
  - name: auth
    description: Регистрация, вход, выход, текущий пользователь
  - name: accounts
    description: Счета
  - name: categories
    description: Категории расходов и доходов
  - name: transactions
    description: Операции (расходы, доходы, переводы, корректировки)
  - name: reports
    description: Отчёты в базовой валюте семьи

paths:
  /currencies:
    get:
      operationId: listCurrencies
      summary: Список активных валют
      description: Валюты, доступные для новых счетов. Публичный справочник, авторизация не нужна.
      tags: [reference]
      security: []
      responses:
        "200":
          description: Активные валюты, отсортированные по коду.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyList"
        default:
          $ref: "#/components/responses/Problem"

  /auth/register:
    post:
      operationId: register
      summary: Регистрация по e-mail и паролю
      description: |
        Создаёт пользователя, его семью (роль `owner`) с категориями по умолчанию,
        отмечает согласие с документами и сразу открывает сессию.

        E-mail сервер обрезает от пробелов и приводит к нижнему регистру.
        Ошибки: 422 `validation_failed` (в т. ч. `email_taken` у поля `email`,
        неизвестный часовой пояс у поля `timezone`), 429 `too_many_requests`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь создан, сессия открыта.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      operationId: login
      summary: Вход по e-mail и паролю
      description: |
        Неверный e-mail и неверный пароль дают один и тот же ответ —
        401 `invalid_credentials`. При превышении лимитов — 429 `too_many_requests`
        с заголовком `Retry-After`: 5 попыток за 15 минут для пары «e-mail + IP»,
        50 неудачных попыток в час для e-mail со всех адресов, 20 запросов
        в минуту с одного IP.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен, сессия открыта.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Выход
      description: |
        Удаляет текущую сессию и стирает cookie. Идемпотентна: без сессии
        (или с недействительной) тоже отвечает 204.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Сессия завершена.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
        default:
          $ref: "#/components/responses/Problem"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Подтверждение e-mail по токену из письма
      description: |
        Публичная: ссылку из письма могут открыть в другом браузере, без сессии.
        Токен одноразовый, действует 24 часа и только для того адреса, на который
        отправлено письмо. Неверный, просроченный или использованный токен —
        422 `validation_failed` с ошибкой `invalid_token` у поля `token`.
        Лимит — 20 запросов в минуту с одного IP (429 `too_many_requests`).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: E-mail подтверждён.
        default:
          $ref: "#/components/responses/Problem"

  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      summary: Отправить письмо подтверждения ещё раз
      description: |
        Отправляет новое письмо на текущий e-mail пользователя; ссылка из прежнего
        письма перестаёт действовать. Если e-mail уже подтверждён, отвечает 204
        и письмо не отправляет. Лимит — раз в минуту и 5 раз в час на пользователя
        (429 `too_many_requests` с `Retry-After`).
      tags: [auth]
      responses:
        "204":
          description: Письмо поставлено на отправку (или e-mail уже подтверждён).
        default:
          $ref: "#/components/responses/Problem"

  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Запросить письмо для сброса пароля
      description: |
        Всегда отвечает 202 без тела — есть такой аккаунт или нет, чтобы ответ
        не выдавал, зарегистрирован ли e-mail. Письмо со ссылкой (действует 1 час)
        уходит, только если аккаунт есть и на адрес отправлено меньше 3 писем
        за час. Лимит по IP — 20 запросов в час (429 `too_many_requests`).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Запрос принят.
        default:
          $ref: "#/components/responses/Problem"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Задать новый пароль по токену из письма
      description: |
        Меняет пароль, завершает **все** сессии пользователя, подтверждает e-mail
        (владение адресом доказано) и открывает новую сессию.
        Неверный, просроченный или использованный токен — 422 `validation_failed`
        с ошибкой `invalid_token` у поля `token`. Лимит — 20 запросов в минуту
        с одного IP (429 `too_many_requests`).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Пароль изменён, сессия открыта.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /me:
    get:
      operationId: getMe
      summary: Текущий пользователь и его семья
      tags: [auth]
      responses:
        "200":
          description: Текущий пользователь.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------
  # Счета. Видны общие счета семьи и личные счета текущего пользователя;
  # чужой личный счёт и счёт другой семьи — 404 на любой операции.
  # ---------------------------------------------------------------------
  /accounts:
    get:
      operationId: listAccounts
      summary: Счета семьи с текущими остатками
      description: |
        Все видимые пользователю счета, **включая архивные** (список короткий,
        фильтрует клиент). Порядок: `sortOrder`, затем время создания.
      tags: [accounts]
      responses:
        "200":
          description: Счета.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAccount
      summary: Создать счёт
      description: |
        Новый счёт встаёт в конец своей группы (общие или личные).
        Ошибки: 422 `validation_failed` (в т. ч. `invalid_value` у `currency`,
        если валюта не активна; `required` у `name`, если имя пустое после обрезки пробелов).
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Счёт создан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"

  /accounts/order:
    put:
      operationId: reorderAccounts
      summary: Задать порядок счетов
      description: |
        `sortOrder` каждого счёта становится равным его позиции в списке (с 0).
        Клиент присылает одну группу (общие или личные): группы показываются
        раздельно. Если хоть один id не найден среди видимых счетов семьи —
        404, порядок не меняется.
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderAccountsRequest"
      responses:
        "204":
          description: Порядок сохранён.
        default:
          $ref: "#/components/responses/Problem"

  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    put:
      operationId: updateAccount
      summary: Изменить счёт
      description: |
        Полная замена редактируемых полей. Валюта и видимость не меняются.
        Архивный счёт редактировать можно.
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: Счёт изменён.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAccount
      summary: Удалить счёт
      description: |
        Удалить можно только счёт без операций. Если на счёт ссылается хоть одна
        операция (в т. ч. удалённая или как счёт-получатель перевода) — 409
        `account_has_transactions`; такой счёт можно только архивировать.
      tags: [accounts]
      responses:
        "204":
          description: Счёт удалён.
        default:
          $ref: "#/components/responses/Problem"

  /accounts/{accountId}/archive:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: archiveAccount
      summary: Архивировать счёт
      description: Идемпотентно — повторный вызов не меняет `archivedAt`.
      tags: [accounts]
      responses:
        "200":
          description: Счёт в архиве.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"

  /accounts/{accountId}/unarchive:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: unarchiveAccount
      summary: Вернуть счёт из архива
      description: Идемпотентно.
      tags: [accounts]
      responses:
        "200":
          description: Счёт активен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"

  /accounts/{accountId}/adjust-balance:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: adjustAccountBalance
      summary: Корректировка остатка
      description: |
        Пользователь вводит фактический остаток. Сервер создаёт операцию
        `adjustment` на разницу (фактический − текущий) с датой «сегодня»
        в часовом поясе пользователя. Разница 0 — операция не создаётся,
        `transactionId` в ответе нет. Архивный счёт — 409 `account_archived`.
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustBalanceRequest"
      responses:
        "200":
          description: Остаток скорректирован.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustBalanceResponse"
        default:
          $ref: "#/components/responses/Problem"

  # --- Категории -------------------------------------------------------------
  /categories:
    get:
      operationId: listCategories
      summary: Все категории семьи
      description: |
        Категории обоих видов, **включая архивные** (фильтрует клиент). Порядок:
        `kind`, затем позиция среди соседей; дерево клиент собирает по `parentId`.
        Порядок «соседей» (одинаковые `kind` и `parentId`) — порядок этого списка.
      tags: [categories]
      responses:
        "200":
          description: Категории семьи.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCategory
      summary: Создать категорию
      description: |
        Новая категория встаёт в конец среди соседей.
        Ошибки (422 `validation_failed`): у поля `parentId` — `invalid_parent`
        (родителя нет в семье, он другого вида, сам подкатегория или в архиве);
        у поля `name` — `name_taken` (у соседей, в т. ч. архивных, уже есть такое имя).
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Категория создана.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Problem"

  /categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    put:
      operationId: updateCategory
      summary: Переименовать категорию
      description: |
        Ошибки: 404 `not_found` (нет в семье), 422 `name_taken` у поля `name`.
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Категория переименована.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Problem"

  /categories/{categoryId}/move:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      operationId: moveCategory
      summary: Переместить категорию (перетаскивание)
      description: |
        Меняет родителя и/или позицию среди соседей. Вид (`kind`) не меняется.
        Позиции старых и новых соседей перенумеровываются.
        Ошибки: 404 `not_found`; 422 у поля `parentId`: `invalid_parent`
        (родителя нет в семье, он другого вида, это сама категория, подкатегория
        или — при смене родителя — архивная категория), `has_children`
        (категорию с подкатегориями нельзя сделать подкатегорией), `name_taken`
        (у новых соседей уже есть такое имя).
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveCategoryRequest"
      responses:
        "200":
          description: Категория перемещена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Problem"

  /categories/{categoryId}/archive:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      operationId: archiveCategory
      summary: Архивировать категорию
      description: |
        Вместе с категорией архивируются её активные подкатегории с тем же
        `archivedAt`. Идемпотентна: архивная категория возвращается как есть.
      tags: [categories]
      responses:
        "200":
          description: Категория в архиве.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Problem"

  /categories/{categoryId}/unarchive:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      operationId: unarchiveCategory
      summary: Вернуть категорию из архива
      description: |
        У категории верхнего уровня вместе с ней возвращаются подкатегории
        с тем же `archivedAt` (архивированные вместе с ней). Подкатегория
        архивного родителя возвращает и родителя (только его, без других
        подкатегорий). Идемпотентна.
      tags: [categories]
      responses:
        "200":
          description: Категория активна.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Problem"

  /categories/{categoryId}/merge:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      operationId: mergeCategory
      summary: Удалить категорию, перенеся операции в другую
      description: |
        Все операции категории и её подкатегорий (включая удалённые) переносятся
        в `targetId`, затем подкатегории и сама категория удаляются. Необратимо.
        Ошибки: 404 `not_found`; 422 `invalid_target` у поля `targetId` (цели нет
        в семье, она другого вида, в архиве, это сама категория или её подкатегория).
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeCategoryRequest"
      responses:
        "204":
          description: Категория удалена, операции перенесены.
        default:
          $ref: "#/components/responses/Problem"
  # --- /Категории ------------------------------------------------------------

  # ---------------------------------------------------------------------
  # Операции. Операция видна, если виден её счёт или счёт-получатель
  # перевода. Невидимая, чужой семьи или удалённая — 404 (кроме restore).
  # ---------------------------------------------------------------------
  /transactions:
    get:
      operationId: listTransactions
      summary: Лента операций
      description: |
        Видимые неудалённые операции. Порядок: дата ↓, затем момент создания ↓.
        Курсорная пагинация (docs/api.md → «Списки и пагинация»): `nextCursor`
        нет на последней странице; неразбираемый курсор — 422 `invalid_format`
        у поля `cursor`.

        `days` — итоги каждой даты, попавшей в `items`, по **всем** операциям
        этой даты под теми же фильтрами (даже если день разрезан границей
        страницы). В итоги входят только расходы и доходы.

        Значения одного параметра объединяются через «или», разные параметры —
        через «и». Невидимый, чужой или несуществующий id в фильтре просто
        ничего не находит.
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionFrom"
        - $ref: "#/components/parameters/TransactionTo"
        - $ref: "#/components/parameters/TransactionKindFilter"
        - $ref: "#/components/parameters/TransactionAccountFilter"
        - $ref: "#/components/parameters/TransactionCategoryFilter"
        - $ref: "#/components/parameters/TransactionAuthorFilter"
        - $ref: "#/components/parameters/TransactionSearch"
        - name: limit
          in: query
          required: false
          description: Размер страницы.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: "`nextCursor` предыдущей страницы, передаётся как есть."
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Страница ленты.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTransaction
      summary: Создать операцию
      description: |
        Расход, доход или перевод (корректировка — только через
        `adjust-balance`). Валюта — валюта счёта. Ошибки (422 `validation_failed`):
        `invalid_account` у `accountId` / `toAccountId` (счёта нет в семье,
        он не виден или в архиве), `same_account` у `toAccountId`,
        `invalid_category` у `categoryId` (нет в семье, другого вида или в архиве),
        `required` / `not_allowed` у полей, которые обязательны или запрещены
        для вида операции, `to_amount_mismatch` у `toAmount` (перевод между
        счетами одной валюты с другой суммой зачисления), `invalid_format`
        у `date` (несуществующая дата) и `comment` (управляющие символы).
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "201":
          description: Операция создана.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        default:
          $ref: "#/components/responses/Problem"

  /transactions/summary:
    get:
      operationId: getTransactionsSummary
      summary: Итоги по отфильтрованным операциям
      description: |
        Те же фильтры, что у ленты (без курсора и лимита). Итоги по валютам,
        только расходы и доходы; пересчёта в рубли нет.
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionFrom"
        - $ref: "#/components/parameters/TransactionTo"
        - $ref: "#/components/parameters/TransactionKindFilter"
        - $ref: "#/components/parameters/TransactionAccountFilter"
        - $ref: "#/components/parameters/TransactionCategoryFilter"
        - $ref: "#/components/parameters/TransactionAuthorFilter"
        - $ref: "#/components/parameters/TransactionSearch"
      responses:
        "200":
          description: Итоги.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"
        default:
          $ref: "#/components/responses/Problem"

  /transactions/defaults:
    get:
      operationId: getTransactionDefaults
      summary: Значения по умолчанию для быстрого ввода
      description: |
        По операциям текущего пользователя (он автор): последний счёт расхода
        и дохода, последняя пара счетов перевода, частые категории (до 8 на
        вид — по числу операций за 90 дней до «сегодня» в поясе пользователя).
        Только видимые неархивные счета и активные категории. Нет данных — `null`
        или пустой список.
      tags: [transactions]
      responses:
        "200":
          description: Значения по умолчанию.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDefaults"
        default:
          $ref: "#/components/responses/Problem"

  /transactions/{transactionId}:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      operationId: getTransaction
      summary: Операция
      tags: [transactions]
      responses:
        "200":
          description: Операция.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateTransaction
      summary: Изменить операцию
      description: |
        Полная замена, тело — как у создания; вид можно менять (расход ↔ доход ↔
        перевод). Ошибки: 404 `not_found`; 403 `transaction_readonly` (пользователь
        видит не все счета операции); 409 `adjustment_readonly` (корректировку
        не правят — только удаляют); 422 — как у создания. Счёт и категория,
        которые не менялись, могут быть в архиве.
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "200":
          description: Операция изменена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTransaction
      summary: Удалить операцию
      description: |
        Мягкое удаление (отмена — `restore`). Корректировку удалить можно.
        Ошибки: 404 `not_found`; 403 `transaction_readonly`.
      tags: [transactions]
      responses:
        "204":
          description: Операция удалена.
        default:
          $ref: "#/components/responses/Problem"

  /transactions/{transactionId}/restore:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    post:
      operationId: restoreTransaction
      summary: Вернуть удалённую операцию
      description: |
        Отмена удаления. Идемпотентно: неудалённая операция возвращается как есть.
        Ошибки: 404 `not_found`; 403 `transaction_readonly`.
      tags: [transactions]
      responses:
        "200":
          description: Операция восстановлена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        default:
          $ref: "#/components/responses/Problem"
  # --- /Операции -------------------------------------------------------------

  # --- Отчёты ----------------------------------------------------------------
  # Общее для всех отчётов (docs/api.md → «Отчёты», «Пересчёт валют»): только
  # видимые пользователю счета, без удалённых операций; суммы — целые
  # минимальные единицы базовой валюты семьи (`currency`), пересчитанные по
  # курсу на дату; валюты без единого курса в отчёт не входят и перечислены
  # в `missingRates`.
  /reports/categories:
    get:
      operationId: getCategoryReport
      summary: Расходы или доходы по категориям
      description: |
        Сумма операций вида `kind` за период по каждой категории, в которую они
        записаны **прямо** (у родителя — только его собственные операции,
        подкатегории — отдельными строками; дерево и доли собирает клиент).
        Архивные категории тоже входят. Переводы и корректировки не входят.
        Порядок — по `amount` ↓, затем по `categoryId`; категорий с нулевой
        суммой нет.

        `total` — точная сумма всех операций, округлённая один раз, а `amount`
        каждой категории округляется отдельно, поэтому сумма `items` может
        отличаться от `total` на несколько минимальных единиц.

        Ошибки (422 `validation_failed`): `invalid_range` у `to` (`from` позже
        `to`), `period_too_long` у `to` (период 10 лет и длиннее).
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/ReportCategoryKind"
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - $ref: "#/components/parameters/ReportAccountFilter"
        - $ref: "#/components/parameters/TransactionAuthorFilter"
      responses:
        "200":
          description: Отчёт.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryReport"
        default:
          $ref: "#/components/responses/Problem"

  /reports/monthly:
    get:
      operationId: getMonthlyReport
      summary: Расходы и доходы по месяцам
      description: |
        По строке на каждый календарный месяц, пересекающийся с периодом
        (пустые — с нулями), по возрастанию. Операции — только с датой внутри
        `[from, to]`, даже если `from` и `to` — середина месяца. Переводы и
        корректировки не входят. Ошибки периода — как у `/reports/categories`.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - $ref: "#/components/parameters/ReportAccountFilter"
        - $ref: "#/components/parameters/TransactionAuthorFilter"
      responses:
        "200":
          description: Отчёт.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"
        default:
          $ref: "#/components/responses/Problem"

  /reports/balance:
    get:
      operationId: getBalanceReport
      summary: Динамика общего баланса
      description: |
        Сумма остатков счетов на конец каждого шага, пересчитанная по курсу на
        дату точки. Шаг выбирает сервер по длине периода (дни включительно):
        до 31 — `day`, до 184 — `week` (ISO, пн–вс), длиннее — `month`. Точка —
        последний день шага, обрезанный по `to`: первая — конец шага, в который
        попадает `from`, последняя — всегда `to`.

        Остаток на дату — начальный остаток счёта плюс все неудалённые операции
        с датой не позже неё (обе стороны переводов, корректировки); начальный
        остаток действует с начала времён. Может быть отрицательным.

        Счета: без `accountId` — все видимые с `includeInTotal`, включая
        архивные; с `accountId` — ровно указанные видимые (независимо от
        `includeInTotal`). Фильтра по автору нет: остаток — свойство счёта.
        Ошибки периода — как у `/reports/categories`.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - $ref: "#/components/parameters/ReportAccountFilter"
      responses:
        "200":
          description: Отчёт.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceReport"
        default:
          $ref: "#/components/responses/Problem"
  # --- /Отчёты ---------------------------------------------------------------

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pa_session
      description: |
        Случайный токен сессии. Cookie выставляет сервер при регистрации и входе:
        `HttpOnly`, `SameSite=Lax`, `Path=/api`, `Secure` (в production).
        Срок — 30 дней, продлевается при активности (не чаще раза в час,
        тогда новый `Set-Cookie` приходит в ответе на любой запрос).

  headers:
    SetSessionCookie:
      description: |
        Cookie сессии: `pa_session=<токен>; Path=/api; Expires=...; Max-Age=2592000; HttpOnly; SameSite=Lax`
        (+ `Secure` в production).
      schema:
        type: string
    ClearSessionCookie:
      description: "Стирает cookie сессии: `pa_session=; Path=/api; Max-Age=0; ...`."
      schema:
        type: string

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    # Фильтры ленты и итогов. Массивы — повторением параметра:
    # ?kind=expense&kind=income.
    TransactionFrom:
      name: from
      in: query
      required: false
      description: Начало периода (дата операции, включительно).
      schema:
        type: string
        format: date
    TransactionTo:
      name: to
      in: query
      required: false
      description: Конец периода (включительно).
      schema:
        type: string
        format: date
    TransactionKindFilter:
      name: kind
      in: query
      required: false
      description: Виды операций.
      schema:
        type: array
        maxItems: 4
        items:
          $ref: "#/components/schemas/TransactionKind"
    TransactionAccountFilter:
      name: accountId
      in: query
      required: false
      description: |
        Счета. Перевод подходит, если подходит любой его видимый счёт.
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          format: uuid
    TransactionCategoryFilter:
      name: categoryId
      in: query
      required: false
      description: Категории; категория верхнего уровня включает свои подкатегории.
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          format: uuid
    TransactionAuthorFilter:
      name: authorId
      in: query
      required: false
      description: Авторы операций (id пользователей).
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          format: uuid
    # Параметры отчётов: период обязателен, оба конца включительно.
    ReportFrom:
      name: from
      in: query
      required: true
      description: Начало периода (включительно).
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      required: true
      description: |
        Конец периода (включительно). Не раньше `from` (иначе `invalid_range`);
        период короче 10 лет: `to` раньше, чем `from` + 10 лет (иначе
        `period_too_long`).
      schema:
        type: string
        format: date
    ReportAccountFilter:
      name: accountId
      in: query
      required: false
      description: |
        Счета (как в ленте: повторением параметра). Невидимый, чужой или
        несуществующий id просто ничего не находит.
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          format: uuid
    ReportCategoryKind:
      name: kind
      in: query
      required: true
      description: Расходы или доходы.
      schema:
        $ref: "#/components/schemas/CategoryKind"
    TransactionSearch:
      name: q
      in: query
      required: false
      description: |
        Подстрока комментария: без учёта регистра, «ё» = «е». Пустая строка
        (или из одних пробелов) — без фильтра.
      schema:
        type: string
        maxLength: 200

  responses:
    Problem:
      description: Ошибка в формате RFC 9457 (Problem Details).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: |
        Ошибка в формате RFC 9457. Клиент выбирает текст для пользователя по `code`;
        `detail` — пояснение для разработчика и запасной вариант.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI типа ошибки. Пока всегда `about:blank`.
          example: about:blank
        title:
          type: string
          description: Краткое описание по HTTP-статусу.
          example: Not Found
        status:
          type: integer
          description: HTTP-статус (дублирует статус ответа).
          example: 404
        detail:
          type: string
          description: Пояснение к конкретному случаю.
        code:
          type: string
          description: |
            Машиночитаемый код ошибки. Список может расширяться — неизвестный код
            клиент обрабатывает по HTTP-статусу. Известные значения:
            `bad_request`, `validation_failed`, `unauthorized`, `invalid_credentials`,
            `forbidden_origin`, `not_found`, `method_not_allowed`, `too_many_requests`, `internal`,
            `account_has_transactions`, `account_archived`, `transaction_readonly`,
            `adjustment_readonly`.
          example: not_found
        errors:
          type: array
          description: Ошибки по полям; только при `code = validation_failed`.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: |
            Путь к полю в camelCase через точку (`amount`, `splits.0.amount`)
            или имя параметра запроса.
          example: amount
        code:
          type: string
          description: |
            Машиночитаемый код нарушения (`required`, `invalid_format`, `too_long`, ...).
            Коды бизнес-правил: `email_taken` — e-mail уже зарегистрирован;
            `invalid_token` — токен из письма неверный, просрочен или уже использован;
            категории: `invalid_parent`, `has_children`, `name_taken`, `invalid_target`
            (см. описания операций категорий); операции: `invalid_account`,
            `same_account`, `invalid_category`, `not_allowed`, `to_amount_mismatch`
            (см. `createTransaction`).

          example: required
        message:
          type: string
          description: Пояснение на русском.

    Currency:
      type: object
      required: [code, name, symbol, minorUnits]
      properties:
        code:
          type: string
          description: Код ISO 4217.
          pattern: "^[A-Z]{3}$"
          example: RUB
        name:
          type: string
          example: Российский рубль
        symbol:
          type: string
          example: ₽
        minorUnits:
          type: integer
          description: Число знаков после запятой. Суммы в этой валюте передаются в 10^minorUnits раз больше.
          example: 2

    CurrencyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Currency"

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name, timezone, acceptTerms]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          # Обычная строка, а не openapi_types.Email: тот при разборе JSON проверяет
          # формат сам, без обрезки пробелов. Формат проверяет валидатор контракта.
          x-go-type: string
          example: ivan@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 8–128 символов, без требований к составу.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Имя; пробелы по краям обрезаются, пустое после обрезки — ошибка.
          example: Иван
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: Часовой пояс IANA (браузер определяет его сам).
          example: Europe/Moscow
        acceptTerms:
          type: boolean
          enum: [true]
          description: Согласие на обработку ПДн и с пользовательским соглашением. Только `true`.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          # Обычная строка, а не openapi_types.Email: тот при разборе JSON проверяет
          # формат сам, без обрезки пробелов. Формат проверяет валидатор контракта.
          x-go-type: string
          example: ivan@example.com
        password:
          type: string
          minLength: 1
          maxLength: 128

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/EmailToken"

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          # Обычная строка, а не openapi_types.Email: тот при разборе JSON проверяет
          # формат сам, без обрезки пробелов. Формат проверяет валидатор контракта.
          x-go-type: string
          example: ivan@example.com

    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          $ref: "#/components/schemas/EmailToken"
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Новый пароль, 8–128 символов (те же правила, что при регистрации).

    EmailToken:
      type: string
      minLength: 1
      maxLength: 256
      description: |
        Токен из ссылки в письме (параметр `token`), передаётся как есть.
        Формат не проверяется схемой: любой неподходящий токен — ошибка
        `invalid_token` у поля `token`.

    FamilyRole:
      type: string
      enum: [owner, member]

    MeUser:
      type: object
      required: [id, email, name, timezone, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          example: ivan@example.com
        name:
          type: string
          example: Иван
        timezone:
          type: string
          example: Europe/Moscow
        emailVerified:
          type: boolean
          description: Подтверждён ли e-mail.

    MeFamily:
      type: object
      required: [id, name, role, memberCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Семья
        role:
          $ref: "#/components/schemas/FamilyRole"
        memberCount:
          type: integer
          description: |
            Число участников семьи, включая текущего пользователя. Клиент по нему
            решает, показывать ли автора операций и фильтр по нему.
          example: 1

    Me:
      type: object
      description: Текущий пользователь и семья, в которой он состоит.
      required: [user, family]
      properties:
        user:
          $ref: "#/components/schemas/MeUser"
        family:
          $ref: "#/components/schemas/MeFamily"

    # -------------------------------------------------------------------
    # Счета
    # -------------------------------------------------------------------
    AccountType:
      type: string
      enum: [cash, card, bank_account, deposit, credit_card, other]

    AccountVisibility:
      type: string
      description: "`shared` — общий счёт семьи; `private` — личный, виден только владельцу."
      enum: [shared, private]

    AccountColor:
      type: string
      nullable: true
      description: |
        Имя цвета палитры Mantine; клиент берёт токен темы по имени.
        `null` — цвет не задан.
      enum: [blue, cyan, teal, green, lime, yellow, orange, red, pink, grape, violet, indigo, gray]

    AccountName:
      type: string
      minLength: 1
      maxLength: 100
      description: Пробелы по краям сервер обрезает; пустое после обрезки — ошибка `required`.
      example: Наличные

    MoneyAmount:
      type: integer
      format: int64
      # ±10^15 минимальных единиц (10 трлн рублей) — с запасом для любых счетов,
      # а сумма остатков многих счетов не переполнит int64.
      minimum: -1000000000000000
      maximum: 1000000000000000
      description: Сумма в минимальных единицах валюты счёта (копейках), может быть отрицательной.
      example: 150000

    Account:
      type: object
      required:
        - id
        - name
        - type
        - currency
        - visibility
        - initialBalance
        - balance
        - includeInTotal
        - color
        - sortOrder
        - archivedAt
        - hasTransactions
        - baseBalance
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Наличные
        type:
          $ref: "#/components/schemas/AccountType"
        currency:
          type: string
          description: Код валюты счёта (ISO 4217).
          example: RUB
        visibility:
          $ref: "#/components/schemas/AccountVisibility"
        initialBalance:
          type: integer
          format: int64
          description: Начальный остаток в минимальных единицах валюты.
        balance:
          type: integer
          format: int64
          description: |
            Текущий остаток: начальный + все неудалённые операции счёта
            (включая операции с будущей датой).
        includeInTotal:
          type: boolean
          description: Учитывать ли счёт в общем балансе.
        color:
          $ref: "#/components/schemas/AccountColor"
        sortOrder:
          type: integer
          format: int32
          description: Порядок внутри группы (общие / личные), по возрастанию.
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Когда счёт архивирован; `null` — активный.
        hasTransactions:
          type: boolean
          description: |
            Есть ли у счёта операции (в т. ч. удалённые). Счёт с операциями
            нельзя удалить — только архивировать.
        baseBalance:
          type: integer
          format: int64
          nullable: true
          description: |
            Остаток в базовой валюте семьи (минимальные единицы): `balance` ×
            последний курс на «сегодня» пользователя (если курсов до сегодня
            нет — ближайший следующий). У счёта в базовой валюте равен
            `balance`; `null`, если у валюты счёта нет ни одного курса.

    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, type, currency, visibility]
      properties:
        name:
          $ref: "#/components/schemas/AccountName"
        type:
          $ref: "#/components/schemas/AccountType"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Код активной валюты из `GET /currencies`.
          example: RUB
        initialBalance:
          $ref: "#/components/schemas/MoneyAmount"
        visibility:
          $ref: "#/components/schemas/AccountVisibility"
        includeInTotal:
          type: boolean
          default: true
        color:
          $ref: "#/components/schemas/AccountColor"

    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, type, initialBalance, includeInTotal, color]
      properties:
        name:
          $ref: "#/components/schemas/AccountName"
        type:
          $ref: "#/components/schemas/AccountType"
        initialBalance:
          $ref: "#/components/schemas/MoneyAmount"
        includeInTotal:
          type: boolean
        color:
          $ref: "#/components/schemas/AccountColor"

    ReorderAccountsRequest:
      type: object
      additionalProperties: false
      required: [accountIds]
      properties:
        accountIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          description: Id счетов в нужном порядке.
          items:
            type: string
            format: uuid

    AdjustBalanceRequest:
      type: object
      additionalProperties: false
      required: [balance]
      properties:
        balance:
          $ref: "#/components/schemas/MoneyAmount"

    AdjustBalanceResponse:
      type: object
      required: [account]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        transactionId:
          type: string
          format: uuid
          description: Id созданной операции-корректировки; нет, если остаток не изменился.

    # --- Категории -----------------------------------------------------------
    CategoryKind:
      type: string
      enum: [expense, income]

    CategoryName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Пробелы по краям сервер обрезает; после обрезки — 1–60 символов.
        Ошибки: пустая строка — `too_short`, только пробелы — `required`,
        длиннее 60 после обрезки — `too_long`, управляющие символы —
        `invalid_format`. Уникально среди соседей (в т. ч. архивных),
        сравнение точное, с учётом регистра.
      example: Продукты

    Category:
      type: object
      required: [id, kind, parentId, name, sortOrder, archivedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/CategoryKind"
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Родитель; `null` — категория верхнего уровня. Глубина дерева — 2.
        name:
          type: string
          example: Продукты
        sortOrder:
          type: integer
          description: |
            Ключ сортировки среди соседей. Значения могут идти с пропусками:
            их сравнивают, а не используют как индекс.
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Момент архивации; `null` — категория активна.

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/CategoryKind"
        parentId:
          type: string
          format: uuid
          nullable: true
          description: |
            Родитель — категория верхнего уровня того же вида, не в архиве.
            Нет или `null` — категория верхнего уровня.
        name:
          $ref: "#/components/schemas/CategoryName"

    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/CategoryName"

    MoveCategoryRequest:
      type: object
      additionalProperties: false
      required: [parentId, index]
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Новый родитель; `null` — верхний уровень. Может совпадать с текущим.
        index:
          type: integer
          minimum: 0
          maximum: 100000
          description: |
            Позиция среди новых соседей (0 — первая) в порядке `GET /categories`,
            считая архивных и не считая саму категорию. Больше числа соседей — в конец.

    MergeCategoryRequest:
      type: object
      additionalProperties: false
      required: [targetId]
      properties:
        targetId:
          type: string
          format: uuid
          description: Категория, в которую переносятся операции.
    # --- /Категории ----------------------------------------------------------

    # --- Операции --------------------------------------------------------------
    TransactionKind:
      type: string
      description: |
        `adjustment` — корректировка остатка: создаётся только через
        `adjust-balance`, её можно удалить и вернуть, но не править.
      enum: [expense, income, transfer, adjustment]

    TransactionInputKind:
      type: string
      description: Виды, которые можно создать или выбрать при правке.
      enum: [expense, income, transfer]

    TransactionAmount:
      type: integer
      format: int64
      # До 10^13 минимальных единиц (100 млрд рублей) на операцию: чтобы
      # SUM(...)::bigint в остатках переполнился, нужно ~900 тыс. предельных
      # операций (техдолг №29).
      minimum: 1
      maximum: 10000000000000
      description: Сумма операции в минимальных единицах валюты счёта, положительная.
      example: 35050

    TransactionUser:
      type: object
      description: Участник семьи (автор операции или владелец скрытого личного счёта).
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Иван

    Transaction:
      type: object
      description: |
        Операция. Суммы положительные, направление задаёт `kind`; исключение —
        корректировка: её `amount` со знаком (изменение остатка).

        Перевод между личным и общим счётом другие участники видят только со
        стороны общего счёта: поля скрытой стороны (`accountId`, `amount`,
        `currency` или `toAccountId`, `toAmount`, `toCurrency`) — `null`, вместо
        них `counterparty` — владелец личного счёта.
      required:
        - id
        - kind
        - date
        - accountId
        - amount
        - currency
        - toAccountId
        - toAmount
        - toCurrency
        - categoryId
        - comment
        - author
        - counterparty
        - editable
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/TransactionKind"
        date:
          type: string
          format: date
          description: Дата операции (без времени).
          example: "2026-11-18"
        accountId:
          type: string
          format: uuid
          nullable: true
          description: Счёт (у перевода — счёт списания); `null` — скрытый чужой личный счёт.
        amount:
          type: integer
          format: int64
          nullable: true
          description: |
            Сумма в валюте `accountId`: положительная, у корректировки — со знаком.
            `null` — сторона скрыта.
        currency:
          type: string
          nullable: true
          description: Валюта `accountId`; `null` — сторона скрыта.
          example: RUB
        toAccountId:
          type: string
          format: uuid
          nullable: true
          description: Счёт зачисления перевода; `null` — не перевод или сторона скрыта.
        toAmount:
          type: integer
          format: int64
          nullable: true
          description: Сумма зачисления в валюте `toAccountId`.
        toCurrency:
          type: string
          nullable: true
          description: Валюта `toAccountId`.
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: Категория расхода или дохода; у перевода и корректировки — `null`.
        comment:
          type: string
          description: Комментарий; пустая строка — нет комментария.
        author:
          allOf:
            - $ref: "#/components/schemas/TransactionUser"
          nullable: true
          description: Кто внёс операцию; `null` — пользователь удалён.
        counterparty:
          allOf:
            - $ref: "#/components/schemas/TransactionUser"
          nullable: true
          description: |
            Владелец скрытого от текущего пользователя личного счёта перевода
            («Пополнение от Ивана»); иначе `null`.
        editable:
          type: boolean
          description: |
            Можно ли править и удалять: пользователь видит все счета операции.
            У корректировки всегда `false` (её можно только удалить — клиент
            узнаёт её по `kind`).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TransactionRequest:
      type: object
      additionalProperties: false
      description: |
        Создание и правка (полная замена). Расход и доход: `categoryId` обязательна,
        `toAccountId` и `toAmount` запрещены. Перевод: `toAccountId` обязателен,
        `categoryId` запрещена; `toAmount` между счетами одной валюты не
        передаётся или равен `amount`, между разными валютами — обязателен
        (обмен валют). Эти правила проверяет сервер (ошибки `required` /
        `not_allowed` / `to_amount_mismatch` у полей).
      required: [kind, date, accountId, amount]
      properties:
        kind:
          $ref: "#/components/schemas/TransactionInputKind"
        date:
          type: string
          format: date
          example: "2026-11-18"
        accountId:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/TransactionAmount"
        categoryId:
          type: string
          format: uuid
          nullable: true
        toAccountId:
          type: string
          format: uuid
          nullable: true
        toAmount:
          allOf:
            - $ref: "#/components/schemas/TransactionAmount"
          nullable: true
        comment:
          type: string
          maxLength: 500
          description: Пробелы по краям сервер обрезает.

    CurrencyTotal:
      type: object
      description: Итог в одной валюте. Суммы положительные; разница — `income - expense`.
      required: [currency, expense, income]
      properties:
        currency:
          type: string
          example: RUB
        expense:
          type: integer
          format: int64
        income:
          type: integer
          format: int64

    TransactionDay:
      type: object
      required: [date, totals]
      properties:
        date:
          type: string
          format: date
        totals:
          type: array
          description: По валютам (по коду); пусто, если за день нет расходов и доходов.
          items:
            $ref: "#/components/schemas/CurrencyTotal"

    TransactionList:
      type: object
      required: [items, days]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        nextCursor:
          type: string
          description: Курсор следующей страницы; нет на последней.
        days:
          type: array
          description: Итоги каждой даты из `items` (в том же порядке).
          items:
            $ref: "#/components/schemas/TransactionDay"

    TransactionSummary:
      type: object
      required: [totals]
      properties:
        totals:
          type: array
          description: По валютам (по коду).
          items:
            $ref: "#/components/schemas/CurrencyTotal"

    TransferAccounts:
      type: object
      required: [accountId, toAccountId]
      properties:
        accountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid

    FrequentCategories:
      type: object
      required: [expense, income]
      properties:
        expense:
          type: array
          description: До 8 id, самые частые первыми.
          items:
            type: string
            format: uuid
        income:
          type: array
          description: До 8 id, самые частые первыми.
          items:
            type: string
            format: uuid

    TransactionDefaults:
      type: object
      required: [expenseAccountId, incomeAccountId, transfer, frequentCategories]
      properties:
        expenseAccountId:
          type: string
          format: uuid
          nullable: true
          description: Счёт последнего расхода пользователя.
        incomeAccountId:
          type: string
          format: uuid
          nullable: true
          description: Счёт последнего дохода пользователя.
        transfer:
          allOf:
            - $ref: "#/components/schemas/TransferAccounts"
          nullable: true
          description: Счета последнего перевода пользователя.
        frequentCategories:
          $ref: "#/components/schemas/FrequentCategories"
    # --- /Операции -------------------------------------------------------------

    # --- Отчёты --------------------------------------------------------------
    BaseAmount:
      type: integer
      format: int64
      description: Сумма в минимальных единицах базовой валюты семьи (поле `currency` отчёта).

    MissingRates:
      type: array
      description: |
        Коды валют, по которым нет ни одного курса: их счета и операции в отчёт
        не вошли. Пусто, если пересчитано всё. По коду.
      items:
        type: string
        example: USD

    CategoryReportItem:
      type: object
      required: [categoryId, amount]
      properties:
        categoryId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: |
            Сумма операций, записанных прямо в эту категорию, в минимальных
            единицах базовой валюты; больше нуля.

    CategoryReport:
      type: object
      required: [currency, total, items, missingRates]
      properties:
        currency:
          type: string
          description: Базовая валюта семьи.
          example: RUB
        total:
          type: integer
          format: int64
          description: |
            Точная сумма всех операций, округлённая один раз. Может отличаться
            от суммы `items` на несколько минимальных единиц.
        items:
          type: array
          description: По `amount` ↓.
          items:
            $ref: "#/components/schemas/CategoryReportItem"
        missingRates:
          $ref: "#/components/schemas/MissingRates"

    MonthlyReportItem:
      type: object
      required: [month, expense, income]
      properties:
        month:
          type: string
          format: date
          description: Первое число месяца.
          example: "2026-11-01"
        expense:
          $ref: "#/components/schemas/BaseAmount"
        income:
          $ref: "#/components/schemas/BaseAmount"

    MonthlyReport:
      type: object
      required: [currency, items, missingRates]
      properties:
        currency:
          type: string
          description: Базовая валюта семьи.
          example: RUB
        items:
          type: array
          description: Каждый месяц периода по возрастанию, пустые — с нулями.
          items:
            $ref: "#/components/schemas/MonthlyReportItem"
        missingRates:
          $ref: "#/components/schemas/MissingRates"

    BalanceStep:
      type: string
      enum: [day, week, month]

    BalancePoint:
      type: object
      required: [date, balance]
      properties:
        date:
          type: string
          format: date
          description: Последний день шага (у последней точки — `to`).
        balance:
          type: integer
          format: int64
          description: |
            Сумма остатков на конец дня в минимальных единицах базовой валюты;
            может быть отрицательной.

    BalanceReport:
      type: object
      required: [currency, step, items, missingRates]
      properties:
        currency:
          type: string
          description: Базовая валюта семьи.
          example: RUB
        step:
          $ref: "#/components/schemas/BalanceStep"
        items:
          type: array
          description: Точки по возрастанию даты; последняя — `to`.
          items:
            $ref: "#/components/schemas/BalancePoint"
        missingRates:
          $ref: "#/components/schemas/MissingRates"
    # --- /Отчёты ---------------------------------------------------------------
