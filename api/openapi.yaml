openapi: 3.0.3
info:
  title: Домашняя бухгалтерия API
  version: 1.0.0
  description: |
    Контракт HTTP API. Соглашения (ошибки, деньги, даты, пагинация) — в docs/api.md.

    Пути ниже указаны относительно `servers[0].url` (`/api/v1`):
    `/currencies` обслуживается по адресу `/api/v1/currencies`.

    Авторизация — cookie сессии `pa_session` (см. `cookieAuth`). По умолчанию
    каждая операция требует входа; публичные помечены `security: []`.
    Без действующей сессии защищённая операция отвечает 401 `unauthorized`.

servers:
  - url: /api/v1

# Глобально все операции требуют сессии. Публичные операции явно
# переопределяют это пустым списком: security: [].
security:
  - cookieAuth: []

tags:
  - name: reference
    description: Справочники
  - name: auth
    description: Регистрация, вход, выход, текущий пользователь
  - name: categories
    description: Категории расходов и доходов

paths:
  /currencies:
    get:
      operationId: listCurrencies
      summary: Список активных валют
      description: Валюты, доступные для новых счетов. Публичный справочник, авторизация не нужна.
      tags: [reference]
      security: []
      responses:
        "200":
          description: Активные валюты, отсортированные по коду.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyList"
        default:
          $ref: "#/components/responses/Problem"

  /auth/register:
    post:
      operationId: register
      summary: Регистрация по e-mail и паролю
      description: |
        Создаёт пользователя, его семью (роль `owner`) с категориями по умолчанию,
        отмечает согласие с документами и сразу открывает сессию.

        E-mail сервер обрезает от пробелов и приводит к нижнему регистру.
        Ошибки: 422 `validation_failed` (в т. ч. `email_taken` у поля `email`,
        неизвестный часовой пояс у поля `timezone`), 429 `too_many_requests`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь создан, сессия открыта.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      operationId: login
      summary: Вход по e-mail и паролю
      description: |
        Неверный e-mail и неверный пароль дают один и тот же ответ —
        401 `invalid_credentials`. При превышении лимитов — 429 `too_many_requests`
        с заголовком `Retry-After`: 5 попыток за 15 минут для пары «e-mail + IP»,
        50 неудачных попыток в час для e-mail со всех адресов, 20 запросов
        в минуту с одного IP.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен, сессия открыта.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Выход
      description: |
        Удаляет текущую сессию и стирает cookie. Идемпотентна: без сессии
        (или с недействительной) тоже отвечает 204.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Сессия завершена.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
        default:
          $ref: "#/components/responses/Problem"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Подтверждение e-mail по токену из письма
      description: |
        Публичная: ссылку из письма могут открыть в другом браузере, без сессии.
        Токен одноразовый, действует 24 часа и только для того адреса, на который
        отправлено письмо. Неверный, просроченный или использованный токен —
        422 `validation_failed` с ошибкой `invalid_token` у поля `token`.
        Лимит — 20 запросов в минуту с одного IP (429 `too_many_requests`).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: E-mail подтверждён.
        default:
          $ref: "#/components/responses/Problem"

  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      summary: Отправить письмо подтверждения ещё раз
      description: |
        Отправляет новое письмо на текущий e-mail пользователя; ссылка из прежнего
        письма перестаёт действовать. Если e-mail уже подтверждён, отвечает 204
        и письмо не отправляет. Лимит — раз в минуту и 5 раз в час на пользователя
        (429 `too_many_requests` с `Retry-After`).
      tags: [auth]
      responses:
        "204":
          description: Письмо поставлено на отправку (или e-mail уже подтверждён).
        default:
          $ref: "#/components/responses/Problem"

  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Запросить письмо для сброса пароля
      description: |
        Всегда отвечает 202 без тела — есть такой аккаунт или нет, чтобы ответ
        не выдавал, зарегистрирован ли e-mail. Письмо со ссылкой (действует 1 час)
        уходит, только если аккаунт есть и на адрес отправлено меньше 3 писем
        за час. Лимит по IP — 20 запросов в час (429 `too_many_requests`).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Запрос принят.
        default:
          $ref: "#/components/responses/Problem"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Задать новый пароль по токену из письма
      description: |
        Меняет пароль, завершает **все** сессии пользователя, подтверждает e-mail
        (владение адресом доказано) и открывает новую сессию.
        Неверный, просроченный или использованный токен — 422 `validation_failed`
        с ошибкой `invalid_token` у поля `token`. Лимит — 20 запросов в минуту
        с одного IP (429 `too_many_requests`).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Пароль изменён, сессия открыта.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /me:
    get:
      operationId: getMe
      summary: Текущий пользователь и его семья
      tags: [auth]
      responses:
        "200":
          description: Текущий пользователь.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  # --- Категории -------------------------------------------------------------
  /categories:
    get:
      operationId: listCategories
      summary: Все категории семьи
      description: |
        Категории обоих видов, **включая архивные** (фильтрует клиент). Порядок:
        `kind`, затем позиция среди соседей; дерево клиент собирает по `parentId`.
        Порядок «соседей» (одинаковые `kind` и `parentId`) — порядок этого списка.
      tags: [categories]
      responses:
        "200":
          description: Категории семьи.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCategory
      summary: Создать категорию
      description: |
        Новая категория встаёт в конец среди соседей.
        Ошибки (422 `validation_failed`): у поля `parentId` — `invalid_parent`
        (родителя нет в семье, он другого вида, сам подкатегория или в архиве);
        у поля `name` — `name_taken` (у соседей, в т. ч. архивных, уже есть такое имя).
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Категория создана.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Problem"

  /categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    put:
      operationId: updateCategory
      summary: Переименовать категорию
      description: |
        Ошибки: 404 `not_found` (нет в семье), 422 `name_taken` у поля `name`.
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Категория переименована.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Problem"

  /categories/{categoryId}/move:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      operationId: moveCategory
      summary: Переместить категорию (перетаскивание)
      description: |
        Меняет родителя и/или позицию среди соседей. Вид (`kind`) не меняется.
        Позиции старых и новых соседей перенумеровываются.
        Ошибки: 404 `not_found`; 422 у поля `parentId`: `invalid_parent`
        (родителя нет в семье, он другого вида, это сама категория, подкатегория
        или — при смене родителя — архивная категория), `has_children`
        (категорию с подкатегориями нельзя сделать подкатегорией), `name_taken`
        (у новых соседей уже есть такое имя).
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveCategoryRequest"
      responses:
        "200":
          description: Категория перемещена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Problem"

  /categories/{categoryId}/archive:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      operationId: archiveCategory
      summary: Архивировать категорию
      description: |
        Вместе с категорией архивируются её активные подкатегории с тем же
        `archivedAt`. Идемпотентна: архивная категория возвращается как есть.
      tags: [categories]
      responses:
        "200":
          description: Категория в архиве.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Problem"

  /categories/{categoryId}/unarchive:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      operationId: unarchiveCategory
      summary: Вернуть категорию из архива
      description: |
        У категории верхнего уровня вместе с ней возвращаются подкатегории
        с тем же `archivedAt` (архивированные вместе с ней). Подкатегория
        архивного родителя возвращает и родителя (только его, без других
        подкатегорий). Идемпотентна.
      tags: [categories]
      responses:
        "200":
          description: Категория активна.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Problem"

  /categories/{categoryId}/merge:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      operationId: mergeCategory
      summary: Удалить категорию, перенеся операции в другую
      description: |
        Все операции категории и её подкатегорий (включая удалённые) переносятся
        в `targetId`, затем подкатегории и сама категория удаляются. Необратимо.
        Ошибки: 404 `not_found`; 422 `invalid_target` у поля `targetId` (цели нет
        в семье, она другого вида, в архиве, это сама категория или её подкатегория).
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeCategoryRequest"
      responses:
        "204":
          description: Категория удалена, операции перенесены.
        default:
          $ref: "#/components/responses/Problem"
  # --- /Категории ------------------------------------------------------------

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pa_session
      description: |
        Случайный токен сессии. Cookie выставляет сервер при регистрации и входе:
        `HttpOnly`, `SameSite=Lax`, `Path=/api`, `Secure` (в production).
        Срок — 30 дней, продлевается при активности (не чаще раза в час,
        тогда новый `Set-Cookie` приходит в ответе на любой запрос).

  headers:
    SetSessionCookie:
      description: |
        Cookie сессии: `pa_session=<токен>; Path=/api; Expires=...; Max-Age=2592000; HttpOnly; SameSite=Lax`
        (+ `Secure` в production).
      schema:
        type: string
    ClearSessionCookie:
      description: "Стирает cookie сессии: `pa_session=; Path=/api; Max-Age=0; ...`."
      schema:
        type: string

  parameters:
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: Ошибка в формате RFC 9457 (Problem Details).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: |
        Ошибка в формате RFC 9457. Клиент выбирает текст для пользователя по `code`;
        `detail` — пояснение для разработчика и запасной вариант.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI типа ошибки. Пока всегда `about:blank`.
          example: about:blank
        title:
          type: string
          description: Краткое описание по HTTP-статусу.
          example: Not Found
        status:
          type: integer
          description: HTTP-статус (дублирует статус ответа).
          example: 404
        detail:
          type: string
          description: Пояснение к конкретному случаю.
        code:
          type: string
          description: |
            Машиночитаемый код ошибки. Список может расширяться — неизвестный код
            клиент обрабатывает по HTTP-статусу. Известные значения:
            `bad_request`, `validation_failed`, `unauthorized`, `invalid_credentials`,
            `forbidden_origin`, `not_found`, `method_not_allowed`, `too_many_requests`, `internal`.
          example: not_found
        errors:
          type: array
          description: Ошибки по полям; только при `code = validation_failed`.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: |
            Путь к полю в camelCase через точку (`amount`, `splits.0.amount`)
            или имя параметра запроса.
          example: amount
        code:
          type: string
          description: |
            Машиночитаемый код нарушения (`required`, `invalid_format`, `too_long`, ...).
            Коды бизнес-правил: `email_taken` — e-mail уже зарегистрирован;
            `invalid_token` — токен из письма неверный, просрочен или уже использован;
            категории: `invalid_parent`, `has_children`, `name_taken`, `invalid_target`
            (см. описания операций категорий).
          example: required
        message:
          type: string
          description: Пояснение на русском.

    Currency:
      type: object
      required: [code, name, symbol, minorUnits]
      properties:
        code:
          type: string
          description: Код ISO 4217.
          pattern: "^[A-Z]{3}$"
          example: RUB
        name:
          type: string
          example: Российский рубль
        symbol:
          type: string
          example: ₽
        minorUnits:
          type: integer
          description: Число знаков после запятой. Суммы в этой валюте передаются в 10^minorUnits раз больше.
          example: 2

    CurrencyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Currency"

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name, timezone, acceptTerms]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          # Обычная строка, а не openapi_types.Email: тот при разборе JSON проверяет
          # формат сам, без обрезки пробелов. Формат проверяет валидатор контракта.
          x-go-type: string
          example: ivan@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 8–128 символов, без требований к составу.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Имя; пробелы по краям обрезаются, пустое после обрезки — ошибка.
          example: Иван
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: Часовой пояс IANA (браузер определяет его сам).
          example: Europe/Moscow
        acceptTerms:
          type: boolean
          enum: [true]
          description: Согласие на обработку ПДн и с пользовательским соглашением. Только `true`.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          # Обычная строка, а не openapi_types.Email: тот при разборе JSON проверяет
          # формат сам, без обрезки пробелов. Формат проверяет валидатор контракта.
          x-go-type: string
          example: ivan@example.com
        password:
          type: string
          minLength: 1
          maxLength: 128

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/EmailToken"

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          # Обычная строка, а не openapi_types.Email: тот при разборе JSON проверяет
          # формат сам, без обрезки пробелов. Формат проверяет валидатор контракта.
          x-go-type: string
          example: ivan@example.com

    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          $ref: "#/components/schemas/EmailToken"
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Новый пароль, 8–128 символов (те же правила, что при регистрации).

    EmailToken:
      type: string
      minLength: 1
      maxLength: 256
      description: |
        Токен из ссылки в письме (параметр `token`), передаётся как есть.
        Формат не проверяется схемой: любой неподходящий токен — ошибка
        `invalid_token` у поля `token`.

    FamilyRole:
      type: string
      enum: [owner, member]

    MeUser:
      type: object
      required: [id, email, name, timezone, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          example: ivan@example.com
        name:
          type: string
          example: Иван
        timezone:
          type: string
          example: Europe/Moscow
        emailVerified:
          type: boolean
          description: Подтверждён ли e-mail.

    MeFamily:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Семья
        role:
          $ref: "#/components/schemas/FamilyRole"

    Me:
      type: object
      description: Текущий пользователь и семья, в которой он состоит.
      required: [user, family]
      properties:
        user:
          $ref: "#/components/schemas/MeUser"
        family:
          $ref: "#/components/schemas/MeFamily"

    # --- Категории -----------------------------------------------------------
    CategoryKind:
      type: string
      enum: [expense, income]

    CategoryName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Пробелы по краям сервер обрезает; после обрезки — 1–60 символов.
        Ошибки: пустая строка — `too_short`, только пробелы — `required`,
        длиннее 60 после обрезки — `too_long`, управляющие символы —
        `invalid_format`. Уникально среди соседей (в т. ч. архивных),
        сравнение точное, с учётом регистра.
      example: Продукты

    Category:
      type: object
      required: [id, kind, parentId, name, sortOrder, archivedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/CategoryKind"
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Родитель; `null` — категория верхнего уровня. Глубина дерева — 2.
        name:
          type: string
          example: Продукты
        sortOrder:
          type: integer
          description: |
            Ключ сортировки среди соседей. Значения могут идти с пропусками:
            их сравнивают, а не используют как индекс.
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Момент архивации; `null` — категория активна.

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/CategoryKind"
        parentId:
          type: string
          format: uuid
          nullable: true
          description: |
            Родитель — категория верхнего уровня того же вида, не в архиве.
            Нет или `null` — категория верхнего уровня.
        name:
          $ref: "#/components/schemas/CategoryName"

    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/CategoryName"

    MoveCategoryRequest:
      type: object
      additionalProperties: false
      required: [parentId, index]
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Новый родитель; `null` — верхний уровень. Может совпадать с текущим.
        index:
          type: integer
          minimum: 0
          maximum: 100000
          description: |
            Позиция среди новых соседей (0 — первая) в порядке `GET /categories`,
            считая архивных и не считая саму категорию. Больше числа соседей — в конец.

    MergeCategoryRequest:
      type: object
      additionalProperties: false
      required: [targetId]
      properties:
        targetId:
          type: string
          format: uuid
          description: Категория, в которую переносятся операции.
    # --- /Категории ----------------------------------------------------------
