# Локальное окружение для разработки: только Postgres.
# API и фронт запускаются на хосте (go run / npm run dev) — так быстрее перезапуск.

# Фиксированное имя проекта: без него compose берёт имя каталога, и
# `docker compose up -d` из git worktree поднимал бы второй Postgres со своим томом
# (и падал бы на занятом порту). С ним все worktree используют один общий Postgres.
name: personal_accounting

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # С версии 18 образ хранит данные в /var/lib/postgresql/18/docker,
      # поэтому том монтируется на уровень выше.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
